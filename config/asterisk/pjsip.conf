[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.22.119/24

; ---------- Extensión 1001 ----------
[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=1001-auth
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=123

[1001]
type=aor
max_contacts=2
remove_existing=yes

