[general]
static=yes
writeprotect=no

[internal]
exten => _100[12],1,NoOp(Llamada de ${CALLERID(num)} a ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

exten => 9000,1,NoOp(Servicio automatico de audio)
 ; Responder
 same => n,Answer()

 ; Grabar llamada
 same => n,MixMonitor(/var/spool/asterisk/monitor/${UNIQUEID}.wav)

 ; Reproducir audio
 same => n,Playback(/var/lib/asterisk/sounds/mensaje)

 ; Finalizar grabacion
 same => n,StopMixMonitor()
 same => n,Hangup()
