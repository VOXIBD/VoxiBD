[general]
static=yes
writeprotect=no

[internal]
exten => _100[12],1,NoOp(Llamada de ${CALLERID(num)} a ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()

exten => 9000,1,NoOp(Servicio automatico de audio)
 same => n,Answer()
 same => n,Playback(/var/lib/asterisk/sounds/mensaje)
 same => n,Hangup()
